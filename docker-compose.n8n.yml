# OPCIONAL — sobreposição para a API alcançar o n8n existente pela rede privada do Docker (e vice-versa).
# NÃO executado. Antes, descubra a rede real do container do n8n na VPS:
#   docker inspect <container-do-n8n> --format '{{json .NetworkSettings.Networks}}'
# Uso:
#   docker compose -f docker-compose.prod.yml -f docker-compose.n8n.yml --env-file deploy/.env.production up -d
# Com isso:
#   - RINNE_N8N_WEBHOOK_URL pode ser http://<servico-n8n>:5678/webhook/... (HTTP aceito só em rede privada);
#   - o n8n chama as ferramentas em http://api:3333/api/internal/tools/<nome> (RINNE_TOOLS_BASE_URL);
#   - /api/internal/ continua bloqueado no nginx para a internet.
services:
  api:
    networks:
      n8n: {}

networks:
  n8n:
    external: true
    name: ${N8N_NETWORK:?defina N8N_NETWORK com a rede real do container do n8n}
