# Cabeçalhos de segurança (incluídos no server e em todo location que usa add_header).
# media-src blob: = pré-escuta local do áudio no RINNE Voz / Modo Reunião (nada é enviado sem ação do usuário).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
# Microfone só nas rotas de voz/reunião (map $permissions_policy no nginx.conf.template). Câmera e localização: sempre bloqueadas.
add_header Permissions-Policy $permissions_policy always;
add_header Cross-Origin-Opener-Policy same-origin always;
# Só tem efeito quando o site é servido via HTTPS (pelo proxy TLS da VPS).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
