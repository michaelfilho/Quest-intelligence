# Cabeçalhos de segurança (incluídos no server e em todo location que usa add_header).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'none'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; media-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
# Esta versão não usa câmera, microfone nem localização: bloqueados em TODAS as páginas.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(), accelerometer=(), gyroscope=(), magnetometer=(), midi=(), serial=(), bluetooth=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
# Só tem efeito quando o site é servido via HTTPS (pelo proxy TLS da VPS).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
